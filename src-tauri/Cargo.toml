[package]
name = "tarot-spread-canvas"
version = "1.0.0"
description = "Tarot Spread Canvas Windows portable application"
authors = ["Suguru Mantic Works"]
edition = "2021"

[lib]
name = "tarot_spread_canvas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "TarotSpreadCanvas"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
